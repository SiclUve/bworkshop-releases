name: Build Windows Exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Desktop (.exe & .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Dofus QuickTranslate v__VERSION__'
          releaseBody: 'Exécutable et installateur autonome Windows (.exe / .msi) pour Dofus QuickTranslate HUD.'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Artifacts (.exe & .msi)
        uses: actions/upload-artifact@v4
        with:
          name: DofusTranslator-Windows
          path: |
            src-tauri/target/release/DofusTranslatorHUD.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
